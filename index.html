<!doctype html>
<html lang="he" dir="rtl" data-theme="gold" data-mode="night" data-board="felt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TouchNest · טאץ'</title>
<meta name="description" content="טאץ' (Russian Bank / Crapette) — משחק הקלפים לשניים: מול המחשב, שניים בטלפון אחד, או אונליין עם דיבור.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="TouchNest · טאץ'">
<meta property="og:description" content="משחק הקלפים טאץ' לשניים — כל אחד עם חפיסה משלו, מעמיסים על היריב וצועקים טאץ'!">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------------- tokens: app theme (data-theme × data-mode) ---------------- */
:root{
  --bg:#070707; --panel:#121212; --panel2:#1a1a1a; --line:#2c2a24; --ink:#f3efe4; --muted:#a39d8c;
  --acc:#d4a940; --acc2:#f0cd6e; --accInk:#140f02; --ok:#46b46e; --bad:#e0584f;
  --felt1:#1f6b45; --felt2:#0f4029; --feltLine:rgba(255,255,255,.14); --feltInk:#f4f1e6;
  --cardFace:#fdfbf4; --cardEdge:#cfcac0; --red:#c4262e; --blk:#141414;
  --deck0:#1d4f9c; --deck1:#a8262e;
  --r:14px; --disp:'Secular One','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --cw:56px;
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
[data-theme="silver"]{--acc:#c9ced6;--acc2:#eef1f5;--accInk:#0d0f12;--line:#2a2d33}
[data-theme="emerald"]{--acc:#3fbf7f;--acc2:#7fe0ae;--accInk:#03140b;--line:#1f3329}
[data-theme="ruby"]{--acc:#e0566a;--acc2:#f598a6;--accInk:#1a0408;--line:#3a2328}
[data-theme="ocean"]{--acc:#4aa8e8;--acc2:#97d0f6;--accInk:#03111c;--line:#1f2d3a}
[data-mode="day"]{--bg:#f4f2ec;--panel:#ffffff;--panel2:#f0ede5;--line:#d9d3c4;--ink:#17150f;--muted:#6b6455}
[data-mode="day"][data-theme="gold"]{--acc:#a8801c;--acc2:#c99b2c;--accInk:#fff}
[data-mode="day"][data-theme="silver"]{--acc:#5c6573;--acc2:#7d8796;--accInk:#fff}
[data-mode="day"][data-theme="emerald"]{--acc:#1f8a55;--acc2:#2ea96b;--accInk:#fff}
[data-mode="day"][data-theme="ruby"]{--acc:#b8344a;--acc2:#d14d62;--accInk:#fff}
[data-mode="day"][data-theme="ocean"]{--acc:#1f6fa8;--acc2:#2f8acb;--accInk:#fff}
/* table colour is its own setting (written after the themes, same specificity → it wins) */
[data-board="felt"]{--felt1:#1f6b45;--felt2:#0f4029;--feltInk:#f4f1e6;--feltLine:rgba(255,255,255,.14)}
[data-board="wood"]{--felt1:#8a5a32;--felt2:#5a3519;--feltInk:#fff6e8;--feltLine:rgba(255,235,200,.18)}
[data-board="blue"]{--felt1:#1d4f7a;--felt2:#0e2a45;--feltInk:#eef5ff;--feltLine:rgba(255,255,255,.14)}
[data-board="contrast"]{--felt1:#0c0c0c;--felt2:#000;--feltInk:#fff;--feltLine:rgba(255,255,255,.4);--cardEdge:#fff}
[data-board="theme"]{--felt1:var(--panel2);--felt2:var(--bg);--feltInk:var(--ink);--feltLine:var(--line)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.hide{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------------- screens ---------------- */
.scr{display:none;min-height:100vh;min-height:100dvh;animation:scrIn .22s ease;padding-top:env(safe-area-inset-top,0px)}
.scr.on{display:block}
@keyframes scrIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar h2{margin:0;font-family:var(--disp);font-weight:400;font-size:21px;flex:1}
.back{min-width:48px;height:44px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-size:22px;font-weight:700;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);font-weight:500;font-size:16px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn.main{background:var(--acc);color:var(--accInk);font-weight:700}
.btn.ghosty{border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.38;cursor:default}
.btn:focus-visible,.back:focus-visible,.ibtn:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-family:var(--disp);font-weight:400;font-size:19px}
.muted{color:var(--muted);font-size:14px}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
input.in,select.in{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:transparent;cursor:pointer;font-size:15px;padding:6px 4px}
.seg button.on{background:var(--acc);color:var(--accInk);font-weight:700}
.seg button:disabled{opacity:.35}
.sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.sw{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.sw:first-of-type{border-top:0}
.sw .t{flex:1}
.sw .t small{display:block;color:var(--muted);font-size:13px}
.tg{width:52px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw.on .tg{background:var(--acc)}
.sw.on .tg::after{inset-inline-start:25px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
.badge{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 8px}

/* ---------------- home ---------------- */
.home{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.htop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.htop .tools{display:flex;gap:8px}
.ibtn{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:20px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.hero{position:relative;margin:16px 0 18px;padding:22px 18px 18px;border-radius:24px;background:radial-gradient(ellipse at 70% 120%,var(--felt1),var(--felt2) 78%);color:var(--feltInk);overflow:hidden;border:1px solid var(--feltLine);min-height:168px}
.hero h1{margin:0;font-family:var(--disp);font-weight:400;font-size:38px;line-height:1.05;position:relative}
.hero h1 small{display:block;font-size:20px;opacity:.85;margin-top:4px}
.hero p{margin:8px 0 0;opacity:.92;font-size:15px;position:relative;max-width:calc(100% - 132px)}
.hero .fan{position:absolute;inset-inline-end:10px;bottom:-22px;height:120px;width:130px;pointer-events:none}
.hero .fan .pc{position:absolute;bottom:0;left:50%;transform-origin:50% 120%;--w:56px}
.hero .hand{position:absolute;inset-inline-end:28px;top:14px;font-size:34px;transform:rotate(-12deg);filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:14px;min-height:70px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--acc);background:transparent;cursor:pointer;text-align:start;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.mode .ic{font-size:28px;width:40px;text-align:center}
.mode b{display:block;font-size:18px}
.mode span{font-size:13px;color:var(--muted)}
.mode.main{background:var(--acc);color:var(--accInk)}
.mode.main span{color:inherit;opacity:.8}
.minor{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.minor button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.minor button i{font-style:normal;font-size:22px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------------- playing cards (CSS only) ---------------- */
.pc{--w:var(--cw);width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.11);background:var(--cardFace);border:1px solid var(--cardEdge);color:var(--blk);position:relative;flex:none;box-shadow:0 2px 4px rgba(0,0,0,.35);font-family:var(--body);user-select:none;-webkit-user-select:none;overflow:hidden}
.pc.red{color:var(--red)}
.pc .ix{position:absolute;top:calc(var(--w)*.04);left:calc(var(--w)*.06);font-weight:700;font-size:calc(var(--w)*.31);line-height:.92;text-align:center;letter-spacing:-.04em;z-index:1}
.pc .ix s{display:block;text-decoration:none;font-size:calc(var(--w)*.27)}
.pc .ix.b{top:auto;left:auto;bottom:calc(var(--w)*.04);right:calc(var(--w)*.06);transform:rotate(180deg)}
.pc.rx .ix:not(.b){left:auto;right:calc(var(--w)*.06)}
.pc.rx .ix.b{right:auto;left:calc(var(--w)*.06)}
.pc .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.6);padding-top:calc(var(--w)*.12)}
.pc .face{position:absolute;inset:calc(var(--w)*.26) calc(var(--w)*.2) calc(var(--w)*.2);border:1.5px solid currentColor;border-radius:calc(var(--w)*.08);display:grid;place-items:center;font-family:var(--disp);font-size:calc(var(--w)*.42);line-height:1;background:color-mix(in srgb,currentColor 7%,transparent)}
.pc .face i{display:block;font-style:normal;font-size:.55em;text-align:center}
.pc .dk{position:absolute;bottom:calc(var(--w)*.05);left:calc(var(--w)*.07);width:calc(var(--w)*.1);height:calc(var(--w)*.1);border-radius:50%;background:var(--deck0);opacity:.85}
.pc.rx .dk{left:auto;right:calc(var(--w)*.07)}
.pc.d1 .dk{background:var(--deck1)}
.pc.bk{background:repeating-linear-gradient(45deg,var(--bk) 0 4px,color-mix(in srgb,var(--bk) 72%,#fff) 4px 6px);border:2px solid #fff}
.pc.bk::after{content:"";position:absolute;inset:16%;border:1.5px solid rgba(255,255,255,.75);border-radius:30%}
.pc.bk.d0{--bk:var(--deck0)}.pc.bk.d1{--bk:var(--deck1)}
.pc.mini{--w:30px}

/* ---------------- game ---------------- */
#game{background:radial-gradient(ellipse at 50% 45%,var(--felt1),var(--felt2) 85%);color:var(--feltInk);padding-top:0}
#game.on{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gtop{display:flex;align-items:center;gap:8px;padding:6px 8px;background:rgba(0,0,0,.28);flex:none}
.gtop .back{height:40px;min-width:44px;border-color:var(--feltInk);color:var(--feltInk)}
.gtop .ttl{flex:1;min-width:0;font-size:13px;line-height:1.2;opacity:.9}
.gtop .ttl b{font-family:var(--disp);font-weight:400;font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtop .ibtn{width:40px;height:40px;background:rgba(0,0,0,.25);border-color:var(--feltLine);color:var(--feltInk)}
.net{font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.35);white-space:nowrap}
.net.bad{background:#a8322a;color:#fff}
.tarea{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px 8px;position:relative}
/* a player's own row: reserve · waste · turned card · stock (the opponent's row is mirrored) */
.prow{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.prow .piles{display:flex;align-items:flex-end;gap:calc(var(--cw)*.14);direction:ltr;justify-content:center}
.prow .who{display:flex;gap:10px;align-items:baseline;justify-content:center;font-size:12px;line-height:1.2;max-width:100%;white-space:nowrap;opacity:.95}
.prow.me .who{order:2}
.prow .who b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
.prow .who .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#46d07a;margin-inline-end:4px}
.prow .who .dot.off{background:#888}
.prow.turn .who b{color:var(--acc2)}
.prow.turn .who b::before{content:"▶ ";font-size:11px}
[dir="rtl"] .prow.turn .who b::before{content:"◀ "}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
.pile .lab{font-size:10px;opacity:.75;white-space:nowrap;line-height:1.1;direction:rtl}
[dir="ltr"] .pile .lab{direction:ltr}
.pile .n{position:absolute;top:-7px;inset-inline-end:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;z-index:3;direction:ltr}
.pile .n.big{background:var(--acc);color:var(--accInk)}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.11);border:1.5px dashed var(--feltLine);display:grid;place-items:center;font-size:calc(var(--cw)*.4);color:var(--feltLine);flex:none;position:relative}
.prow.opp{--cw:var(--ocw)}
.prow .stack{position:relative}
.prow .stack .pc+.pc{position:absolute;left:0}
.drawn .pc{box-shadow:0 0 0 3px var(--acc2),0 6px 14px rgba(0,0,0,.5);animation:flipIn .3s ease}
@keyframes flipIn{from{transform:rotateY(90deg) scale(.9)}to{transform:none}}
/* the board: 4 rows × [left pile · two foundations · right pile] */
.board{display:grid;grid-template-columns:1fr calc(var(--cw)*2 + 6px) 1fr;row-gap:calc(var(--cw)*.1);column-gap:calc(var(--cw)*.08);direction:ltr;align-items:center}
.fpair{display:flex;gap:6px;justify-content:center}
.fpair .slot{font-size:calc(var(--cw)*.5);color:var(--feltLine)}
.tp{position:relative;height:calc(var(--cw)*1.4);min-width:var(--cw)}
.tp .slot,.tp .pc{position:absolute;top:0}
.tp.l .slot,.tp.l .pc{right:0}
.tp.r .slot,.tp.r .pc{left:0}
.tgt{box-shadow:0 0 0 3px var(--acc2),0 0 14px color-mix(in srgb,var(--acc2) 70%,transparent)!important;border-radius:calc(var(--cw)*.11)}
.held{outline:3px dashed var(--bad);outline-offset:2px}
.held::after{content:'✋';position:absolute;bottom:calc(var(--cw)*.06);left:50%;transform:translateX(-50%);font-size:calc(var(--cw)*.38);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));pointer-events:none;z-index:5}
.slot.tgt{border-style:solid;border-color:var(--acc2)}
.sel{transform:translateY(calc(var(--cw)*-.12));box-shadow:0 0 0 3px var(--bad),0 8px 14px rgba(0,0,0,.45)!important}
.hintc{animation:hintP 1s ease-in-out 3;box-shadow:0 0 0 3px var(--ok)!important}
.must{animation:hintP 1s ease-in-out 2;box-shadow:0 0 0 3px var(--bad)!important}
@keyframes hintP{0%,100%{transform:none}50%{transform:scale(1.07)}}
.land{animation:landIn .28s ease}
@keyframes landIn{from{opacity:.2}to{opacity:1}}
[data-src],[data-dst],[data-act]{cursor:pointer;touch-action:none}
.msg{min-height:22px;text-align:center;font-size:14px;padding:0 8px;font-weight:500;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.abar{display:flex;gap:8px;padding:6px 10px 8px;flex:none;background:rgba(0,0,0,.22)}
.abar .btn{flex:1;min-height:52px;padding:4px 6px;font-size:16px;line-height:1.15;color:var(--feltInk);border-color:var(--feltLine);flex-direction:column;gap:0}
.abar .btn small{font-size:11px;opacity:.85;font-weight:400}
.abar .btn.sm{flex:0 0 54px}
.abar .btn.main{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.abar .btn.touch{background:#c0392b;border-color:#e74c3c;color:#fff;font-family:var(--disp);font-size:20px;flex:1.4}
.abar .btn.touch.lock{opacity:.4}
.otouch{position:absolute;top:2px;left:50%;transform:translateX(-50%) rotate(180deg);z-index:6}
.otouch .btn{background:#c0392b;border-color:#e74c3c;color:#fff;font-family:var(--disp);min-height:44px;padding:4px 16px}
.voice{display:flex;gap:8px;padding:0 10px 8px;flex:none;background:rgba(0,0,0,.22)}
.voice .btn{flex:1;min-height:44px;color:var(--feltInk);border-color:var(--feltLine);font-size:15px;padding:4px 6px}
.voice .btn.on{background:#2e8b57;border-color:#2e8b57;color:#fff}
.voice .btn.rec.on{background:#c0392b;border-color:#c0392b}
.ptt{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dragGhost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-60%) rotate(-4deg) scale(1.06);box-shadow:0 12px 24px rgba(0,0,0,.5)}
.flyc{position:fixed;z-index:45;pointer-events:none;transition:left .28s ease,top .28s ease}
.tn-banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:46;pointer-events:none;text-align:center;white-space:nowrap;padding:12px 22px;border-radius:20px;background:rgba(8,8,8,.88);border:2px solid var(--acc);box-shadow:0 0 28px color-mix(in srgb,var(--acc) 45%,transparent);animation:bannerIn 2.6s cubic-bezier(.2,.9,.3,1.2) forwards;max-width:94vw}
.tn-banner b{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(30px,10vw,52px);line-height:1;color:var(--acc2)}
.tn-banner span{display:block;margin-top:6px;color:#f3efe4;font-size:14px;font-weight:500;white-space:normal}
.tn-banner.touch{border-color:#e74c3c}.tn-banner.touch b{color:#ff6b5b}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}22%{transform:translate(-50%,-50%) scale(1)}84%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* landscape phone: opponent column · board · my column */
@media (orientation:landscape) and (max-height:560px){
  .tarea{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:1fr;align-items:center;gap:10px}
  .prow .piles{flex-wrap:wrap;max-width:calc(var(--cw)*2.6);row-gap:14px}
  .prow.me .who{order:0}
  .prow.opp{grid-column:1;grid-row:1;justify-self:center}
  .board{grid-column:2;grid-row:1}
  .prow.me{grid-column:3;grid-row:1;justify-self:center}
  .msg{position:absolute;bottom:2px;left:0;right:0}
}

/* ---------------- overlays ---------------- */
#ovs .ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#ovs .box{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:16px;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
#ovs .ov.center{align-items:center}
.ov h3{margin:0 0 6px;font-family:var(--disp);font-weight:400;font-size:24px}
.res .big{font-family:var(--disp);font-size:30px;text-align:center;margin:4px 0 8px;color:var(--acc)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}

<script>
/* ---- nestlink.js ---- */
/* =====================================================================
   NestLink 1.1 — AppNest online multiplayer module (WebRTC via PeerJS)
   One file, drop into any AppNest game. No server of our own:
   - a public PeerJS server only introduces the phones; game data, voice
     and voice messages then travel directly phone-to-phone.
   - star layout: the host is seat 0 and relays messages between guests,
     so 2–6 players work; voice is a direct mesh (good up to ~4–5).
   - every game message is sequenced and re-sent after a reconnect.
   The game owns the session object (persist it with the game state) and
   receives events through callbacks. See NESTLINK.md for the API.
   1.1: sendTo(seat, d) — a private message to one seat only (card games:
        the host deals each player only their own cards). Compatible with 1.0.
        Heartbeat: a phone that vanished (app closed, no signal) is marked offline
        within ~10 s instead of looking connected forever.
        After a reconnect, if the other side already got more messages than we
        remember sending (we restored an older saved session), numbering continues
        after theirs instead of being silently ignored.
   ===================================================================== */
const NestLink = (() => {
  const CDNS = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js'];
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  const AB = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const genCode = (n = 5) => Array.from({ length: n }, () => AB[Math.floor(Math.random() * AB.length)]).join('');
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function loadScript(u) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(rej, 12000); }); }
  async function loadPeer() { if (window.Peer) return true; for (const u of CDNS) { try { await loadScript(u); if (window.Peer) return true; } catch (e) {} } return false; }
  const b64 = buf => { let s = '', a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

  function create(opt) {
    const L = { status: 'off', lastErr: null, peer: null, conns: {}, retry: null, chunks: {}, calls: {}, audio: {}, mic: null, talking: false, openMic: false, rec: null, seen: {}, hb: {}, hbT: null };
    let S = null;                                         // the session — owned and persisted by the game
    const ev = (k, ...a) => { try { opt[k] && opt[k](...a); } catch (e) { console.error(e); } };
    const persist = () => ev('persist', S);
    const roomId = c => (opt.app || 'nest') + '-v1-' + c.toLowerCase();
    const max = () => opt.maxPlayers || 2;
    const isHost = () => S && S.role === 'host';
    function peerOpts() {
      const q = new URLSearchParams(location.search), o = { debug: 0, config: { iceServers: opt.iceServers || ICE } };
      if (q.get('peerhost')) { o.host = q.get('peerhost'); o.port = +(q.get('peerport') || 9000); o.path = '/'; o.secure = false; }   // test servers only
      return o;
    }
    function setStatus(st, err) { L.status = st; if (err !== undefined) L.lastErr = err; ev('onStatus', st, L.lastErr); }
    const link = seat => S.links[seat] || (S.links[seat] = { seq: 0, lastIn: 0, out: [] });
    const rosterEntry = seat => S.roster.find(p => p.seat === seat);
    function rawTo(seat, m) { const c = L.conns[seat]; try { if (c && c.open) c.send(m); } catch (e) {} }
    function rawAll(m, except) { for (const s in L.conns) if (+s !== except) rawTo(+s, m); }

    /* ---------- starting ---------- */
    async function start(session) {
      close(true); S = session; persist();
      L.hbT = setInterval(beat, 3000);                   // after close(), which clears it
      setStatus('connecting');
      if (!(await loadPeer())) { setStatus('error', 'load'); return false; }
      const peer = L.peer = new Peer(isHost() ? roomId(S.code) : undefined, peerOpts());
      peer.on('open', id => {
        S.pid = id; if (isHost()) { const me = rosterEntry(0); if (me) { me.pid = id; me.online = true; } }
        persist(); setStatus(isHost() ? 'waiting' : 'connecting'); if (!isHost()) connectHost();
      });
      peer.on('connection', c => { if (isHost()) attach(c, null); });
      peer.on('call', onCall);
      peer.on('disconnected', () => setTimeout(() => { try { if (L.peer === peer && !peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500));
      peer.on('error', e => {
        const t = e && e.type;
        if (t === 'unavailable-id') {                     // room id still held (e.g. after reload) — new code while nobody joined, else retry
          if (S.roster.length < 2) { S.code = genCode(); persist(); ev('onCode', S.code); }
          setTimeout(() => start(S), S.roster.length < 2 ? 300 : 4000); return;
        }
        if (t === 'peer-unavailable') { setStatus('notfound', 'nf'); scheduleRetry(); return; }
        if (/network|server-error|socket/.test(t || '')) setStatus('error', 'net');
      });
      return true;
    }
    function host(code) {
      return start({ role: 'host', code: code || genCode(), seat: 0, cid: uid(), roster: [{ seat: 0, name: opt.name ? opt.name() : '', online: true, cid: null, voice: false }], links: {} });
    }
    function join(code) { return start({ role: 'guest', code: code.toUpperCase(), seat: null, cid: uid(), roster: [], links: {} }); }
    function resume(session) { return start(session); }
    function scheduleRetry() { clearTimeout(L.retry); if (S && !isHost() && !(L.conns[0] && L.conns[0].open)) L.retry = setTimeout(connectHost, 3000); }
    function connectHost() { if (!L.peer || L.peer.destroyed || (L.conns[0] && L.conns[0].open)) return; attach(L.peer.connect(roomId(S.code), { reliable: true, serialization: 'json' }), 0); scheduleRetry(); }

    /* ---------- connections ---------- */
    function attach(c, seat) {
      let mySeat = seat;                                  // the seat at the other end of this connection
      const onOpen = () => {
        if (!isHost()) { L.conns[0] = c; rawTo(0, { t: 'hi', cid: S.cid, name: opt.name ? opt.name() : '', have: link(0).lastIn, v: opt.version, hb: 1 }); }
      };
      if (c.open) onOpen(); else c.on('open', onOpen);
      c.on('data', m => {
        if (!m || !m.t) return;
        const key = isHost() ? mySeat : 0;                // 1.1 heartbeat: remember when we last heard from them
        if (key != null) L.seen[key] = Date.now();
        if (m.t === 'ping') { if (key != null) L.hb[key] = 1; return; }
        if (isHost() && m.t === 'hi') {                   // a guest introduces itself → give it a seat (same seat when it comes back)
          let p = S.roster.find(x => x.cid === m.cid);
          if (!p) {
            if (S.roster.length >= max()) { try { c.send({ t: 'full' }); c.close(); } catch (e) {} return; }
            let s = 1; while (S.roster.some(x => x.seat === s)) s++;
            p = { seat: s, cid: m.cid, name: '', online: true, voice: false }; S.roster.push(p); S.roster.sort((a, b) => a.seat - b.seat);
            ev('onJoin', s);
          }
          mySeat = p.seat; p.name = (m.name || '').slice(0, 20); p.online = true; p.pid = c.peer;
          if ((m.have || 0) > link(mySeat).seq) link(mySeat).seq = m.have;   // 1.1: we restored an older session — keep numbering after what they already got
          if (L.conns[mySeat] && L.conns[mySeat] !== c) { try { L.conns[mySeat].close(); } catch (e) {} }
          L.conns[mySeat] = c; L.seen[mySeat] = Date.now(); L.hb[mySeat] = m.hb ? 1 : 0;   // 1.1 phones announce the heartbeat
          rawTo(mySeat, { t: 'hi', seat: mySeat, have: link(mySeat).lastIn, roster: S.roster, v: opt.version, hb: 1 });
          link(mySeat).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(mySeat, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          persist(); broadcastRoster(); setStatus('open'); callEveryone();
          return;
        }
        if (!isHost() && m.t === 'hi') {
          S.seat = m.seat; S.roster = m.roster || []; L.seen[0] = Date.now(); L.hb[0] = m.hb ? 1 : 0;
          if ((m.have || 0) > link(0).seq) link(0).seq = m.have;            // 1.1: same protection on the guest side
          persist();
          link(0).out.filter(x => x.seq > (m.have || 0)).forEach(x => rawTo(0, x));
          if (m.v && opt.version && m.v.split('.')[0] !== opt.version.split('.')[0]) ev('onVersion', m.v);
          clearTimeout(L.retry); setStatus('open'); ev('onRoster', S.roster); callEveryone(); return;
        }
        if (m.t === 'full') { setStatus('full', 'full'); close(true); return; }
        onData(m, isHost() ? mySeat : 0);
      });
      const gone = () => {
        if (isHost()) { if (mySeat == null || L.conns[mySeat] !== c) return; delete L.conns[mySeat]; const p = rosterEntry(mySeat); if (p) p.online = false; persist(); broadcastRoster(); setStatus(Object.keys(L.conns).length ? 'open' : 'waiting'); }
        else { if (L.conns[0] !== c) return; delete L.conns[0]; setStatus('reconnecting'); scheduleRetry(); }
        stopAudioFrom(mySeat);
      };
      c.on('close', gone); c.on('error', gone);
    }
    function broadcastRoster() { if (!isHost()) return; rawAll({ t: 'roster', roster: S.roster }); ev('onRoster', S.roster); }

    /* ---------- messages ---------- */
    function onData(m, via) {
      if (m.t === 'roster') { S.roster = m.roster; persist(); ev('onRoster', S.roster); callEveryone(); return; }
      if (m.t === 'need') { link(via).out.filter(x => x.seq > m.have).forEach(x => rawTo(via, x)); return; }
      if (m.t === 'emo' || m.t === 'talk' || m.t === 'vm') {
        if (isHost()) rawAll(m, via);                     // relay to the other guests
        if (m.t === 'emo') ev('onEmoji', m.e, m.from);
        else if (m.t === 'talk') { const p = rosterEntry(m.from); if (p) p.talking = m.on; ev('onTalk', m.from, m.on); }
        else gotChunk(m);
        return;
      }
      if (m.t === 'voice') { const p = rosterEntry(m.from); if (p) p.voice = m.on; if (isHost()) { rawAll(m, via); broadcastRoster(); } callEveryone(); return; }
      if (m.t !== 'm') return;
      const lk = link(via);
      if (m.seq <= lk.lastIn) return;
      if (m.seq > lk.lastIn + 1) { rawTo(via, { t: 'need', have: lk.lastIn }); return; }
      lk.lastIn = m.seq; persist();
      if (isHost() && max() > 2 && !m.p) for (const p of S.roster) if (p.seat !== 0 && p.seat !== m.from) seqTo(p.seat, m.d, m.from);
      ev('onMessage', m.d, m.from);
    }
    function seqTo(seat, d, from, priv) {
      const lk = link(seat), m = { t: 'm', seq: ++lk.seq, from, d }; if (priv) m.p = 1;
      lk.out.push(m); if (lk.out.length > 300) lk.out.splice(0, lk.out.length - 300);
      rawTo(seat, m);
    }
    function send(d) {                                    // reliable, ordered, reaches every other player
      if (!S) return;
      if (isHost()) { for (const p of S.roster) if (p.seat !== 0) seqTo(p.seat, d, 0); }
      else seqTo(0, d, S.seat);
      persist();
    }
    function sendTo(seat, d) {                            // private: host → one guest, or guest → host only (not relayed)
      if (!S || seat === S.seat) return;
      if (isHost()) { if (S.roster.some(p => p.seat === seat)) seqTo(seat, d, 0, true); }
      else seqTo(0, d, S.seat, true);
      persist();
    }
    function emoji(e) { if (S) rawAll({ t: 'emo', e, from: S.seat }); }
    const isOpen = () => !!S && (isHost() ? Object.values(L.conns).some(c => c.open) : !!(L.conns[0] && L.conns[0].open));

    /* ---------- voice: push-to-talk / open mic (direct mesh) ---------- */
    async function micOn() {
      if (L.mic) return true;
      try { L.mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
      catch (e) { ev('onMicError', e && e.name); return false; }
      L.mic.getAudioTracks().forEach(t => t.enabled = L.openMic);
      const me = rosterEntry(S.seat); if (me) me.voice = true;
      const m = { t: 'voice', on: true, from: S.seat }; rawAll(m);
      callEveryone(); return true;
    }
    function callEveryone() {                             // each phone with a mic sends its own one-way audio call to every other phone
      if (!L.mic || !L.peer || !S) return;
      for (const p of S.roster) {
        if (p.seat === S.seat || !p.online || !p.pid) continue;
        const c = L.calls[p.seat]; if (c && !c._dead) continue;
        try { const call = L.peer.call(p.pid, L.mic, { metadata: { seat: S.seat } }); L.calls[p.seat] = call; call.on('close', () => { call._dead = true; }); call.on('error', () => { call._dead = true; }); } catch (e) {}
      }
    }
    function onCall(call) {

rulesA:"<h3>המטרה</h3><p>לכל שחקן חפיסה שלמה משלו. מנצח מי שנפטר ראשון מכל הקלפים שלו: <b>הקופה הקטנה</b>, <b>המקור</b> ו<b>הזריקה</b>.</p><h3>הסידור</h3><p>כל שחקן מניח <b>13 קלפים בקופה הקטנה</b> — העליון גלוי. ארבעה קלפים גלויים בצד שלו של השולחן — בסך הכל <b>8 ערימות שולחן</b> משותפות. שאר הקלפים הם <b>המקור</b>, סגור. באמצע יש מקום ל<b>8 ערימות אסים</b>.</p><h3>ערימות האסים</h3><p>משותפות לשני השחקנים. בונים <b>מאס עד מלך, לפי צורה</b>. אס גלוי <b>חייב</b> לעלות.</p>",

rulesC:"<h3>להעמיס על היריב</h3><p>מותר להניח קלף על <b>הקופה הקטנה</b> ועל <b>הזריקה</b> של היריב — <b>אותה צורה, אחד למעלה או למטה</b>. על 9♠ אפשר 8♠ או 10♠. הקלף הופך לקלף של היריב. אפשר להעמיס מהקופה הקטנה, מהקלף הפתוח ומהשולחן.</p>",
rulesD:"<h3>התור</h3><ol><li>קודם — כל קלף שיכול לעלות לאסים <b>חייב</b> לעלות.</li><li>אחר כך — אם הקלף העליון בקופה הקטנה יכול לזוז (לשולחן, לאסים או על היריב), <b>חייבים</b> להזיז אותו לפני שפותחים מהמקור.</li><li>מסדרים את השולחן כרצונך, ופותחים <b>קלף אחד</b> מהמקור. אפשר לשחק אותו — ולפתוח עוד.</li><li>קלף פתוח שלא שיחקת — מניחים ב<b>זריקה</b>, ו<b>התור נגמר</b>.</li></ol><p>נגמר המקור? הזריקה מתהפכת והופכת למקור חדש. נגמרו גם המקור וגם הזריקה? משחקים מהקופה הקטנה ומהשולחן, ו\"מעבירים תור\".</p><h3>טאץ'!</h3><p><b>חוקי מתחילים:</b> האפליקציה לא נותנת לשבור את הסדר, ומסבירה מה קודם.</p><p><b>חוקים קלאסיים:</b> אפשר לטעות. אם היריב לא העלה קלף שיכול לעלות לאסים, פתח מהמקור כשהקופה הקטנה יכלה לזוז, או <b>נגע בקלף ושיחק קלף אחר</b> (נגעת — שיחקת!) — יש לך <b>5 שניות</b> ללחוץ <b>טאץ'!</b>. המהלך השגוי מתבטל, והתור עובר אליך. טאץ' בלי טעות? לא קורה כלום, אבל הכפתור ננעל לכמה שניות.</p><h3>ניקוד</h3><p>המנצח מקבל <b>30</b>, ועוד <b>2</b> לכל קלף שנשאר ליריב בקופה הקטנה, ועוד <b>1</b> לכל קלף שנשאר לו במקור ובזריקה. בסדרה — מי שמגיע ראשון ל-100 (או 200). אם אף אחד לא מצליח להתקדם הרבה זמן — תיקו.</p><h3>טיפים</h3><ul><li>הקופה הקטנה היא העיקר — כל קלף שם שווה 2 נקודות ליריב.</li><li>מקום ריק לפני שפותחים קלף — מצוין: כל קלף שתפתח ייכנס אליו והתור ימשיך. מקום ריק כשהתור נגמר — מתנה ליריב.</li><li>העמסה על הקופה הקטנה של היריב היא המהלך הכי חזק במשחק.</li></ul>"

rulesA:"<h3>Objetivo</h3><p>Cada jugador tiene su propia baraja completa. Gana quien primero se quede sin cartas: <b>reserva</b>, <b>mazo</b> y <b>descarte</b>.</p><h3>Preparación</h3><p>Cada uno pone <b>13 cartas en la reserva</b> (la de arriba destapada) y cuatro cartas destapadas en su lado de la mesa — <b>8 montones de mesa</b> compartidos en total. El resto es el <b>mazo</b>, tapado. En el centro hay sitio para <b>8 montones de ases</b>.</p><h3>Montones de ases</h3><p>Compartidos por ambos. Se construyen <b>del as al rey, por palo</b>. Un as a la vista <b>debe</b> subir.</p>",
rulesB:"<h3>Montones de mesa</h3><p>Se construyen <b>en orden descendente alternando colores</b> — una reina roja sobre un rey negro, y sobre ella una jota negra. Solo se mueve la carta de arriba. <b>Un hueco acepta cualquier carta.</b></p>",
rulesC:"<h3>Cargar al rival</h3><p>Puedes poner una carta en la <b>reserva</b> y el <b>descarte</b> del rival — <b>mismo palo, uno más o uno menos</b>. Sobre 9♠ va 8♠ o 10♠. La carta pasa a ser suya. Puedes cargar desde tu reserva, tu carta destapada y la mesa.</p>",
rulesD:"<h3>Tu turno</h3><ol><li>Primero — toda carta que pueda subir a los ases <b>debe</b> subir.</li><li>Después — si la carta de arriba de tu reserva puede moverse (a la mesa, a los ases o al rival), <b>debes</b> moverla antes de destapar del mazo.</li><li>Ordena la mesa a tu gusto y destapa <b>una carta</b> del mazo. Puedes jugarla — y destapar otra.</li><li>La carta destapada que no juegues va a tu <b>descarte</b>, y <b>tu turno termina</b>.</li></ol><p>¿Se acabó el mazo? El descarte se da la vuelta y es el nuevo mazo. ¿Mazo y descarte vacíos? Juega desde la reserva y la mesa, y \"pasa\".</p><h3>¡Touch!</h3><p><b>Reglas de principiante:</b> la app no deja romper el orden y explica qué va primero.</p><p><b>Reglas clásicas:</b> se puede fallar. Si el rival no subió una carta a los ases, destapó del mazo cuando la reserva podía moverse, o <b>tocó una carta y jugó otra</b> (¡carta tocada, carta jugada!) — tienes <b>5 segundos</b> para pulsar <b>¡Touch!</b>. La jugada mala se deshace y el turno es tuyo. ¿Touch sin error? No pasa nada, pero el botón se bloquea unos segundos.</p><h3>Puntos</h3><p>El ganador recibe <b>30</b>, más <b>2</b> por cada carta que le quede al rival en la reserva, más <b>1</b> por cada carta en su mazo y descarte. En una serie — el primero en llegar a 100 (o 200). Si nadie avanza durante mucho tiempo — empate.</p><h3>Consejos</h3><ul><li>Lo importante es la reserva: cada carta ahí vale 2 para el rival.</li><li>Un hueco antes de destapar es estupendo: lo que salga cabe ahí y sigues jugando. Un hueco al terminar el turno es un regalo.</li><li>Cargar la reserva del rival es la jugada más fuerte del juego.</li></ul>"

rulesD:"<h3>الدور</h3><ol><li>أولًا — كل ورقة يمكن أن ترتفع إلى الآصات <b>يجب</b> أن ترتفع.</li><li>ثم — إذا كانت الورقة العليا في الاحتياط تستطيع الحركة (إلى الطاولة أو الآصات أو على الخصم)، <b>يجب</b> تحريكها قبل الكشف من الرزمة.</li><li>رتّب الطاولة كما تشاء واكشف <b>ورقة واحدة</b> من الرزمة. يمكنك لعبها — وكشف أخرى.</li><li>الورقة المكشوفة التي لم تلعبها تذهب إلى <b>الرمي</b>، و<b>ينتهي دورك</b>.</li></ol><p>انتهت الرزمة؟ يُقلب الرمي ليصبح رزمة جديدة. الرزمة والرمي فارغان؟ العب من الاحتياط والطاولة ثم \"مرّر\".</p><h3>تاتش!</h3><p><b>قواعد المبتدئين:</b> التطبيق لا يسمح بكسر الترتيب ويشرح ما يأتي أولًا.</p><p><b>القواعد الكلاسيكية:</b> الخطأ مسموح. إذا لم يرفع الخصم ورقة إلى الآصات، أو كشف من الرزمة بينما كان الاحتياط يستطيع الحركة، أو <b>لمس ورقة ولعب غيرها</b> (لمستها — العبها!) — لديك <b>5 ثوانٍ</b> لتضغط <b>تاتش!</b>. تُلغى الحركة الخاطئة والدور لك. تاتش بلا خطأ؟ لا يحدث شيء، لكن الزر يُقفل بضع ثوانٍ.</p><h3>النقاط</h3><p>الفائز يحصل على <b>30</b>، و<b>2</b> لكل ورقة بقيت في احتياط الخصم، و<b>1</b> لكل ورقة بقيت في رزمته ورميه. في السلسلة — أول من يصل إلى 100 (أو 200). إذا لم يتقدم أحد لوقت طويل — تعادل.</p><h3>نصائح</h3><ul><li>الاحتياط هو الأهم — كل ورقة فيه تساوي نقطتين للخصم.</li><li>مكان فارغ قبل أن تكشف ورقة — ممتاز: أي ورقة تدخله ويستمر دورك. مكان فارغ عند نهاية دورك — هدية للخصم.</li><li>تحميل احتياط الخصم هو أقوى حركة في اللعبة.</li></ul>"
};

/* ---- table.js ---- */
/* =====================================================================
   TouchNest — the table: session, rendering, input (tap · drag · magnet), computer turns,
   the "Touch!" window, undo, hint, end of game, match score.
   G (the session, saved on every change):
     mode 'cpu' | 'two' | 'online' · M the engine game (local / host) · v the view (guest)
     names [2] · lvl (cpu) · target (0 = one game) · score [2] · gameNo · counted {}
   ===================================================================== */
let G = LS.get('game', null);
const saveGame = () => LS.set('game', G);
let aiT = null, violT = null, catchT = null, BUSY = false, busyT = null, SEL = null, HINT = null, turnMoves = 0, lastTurnSeen = -1;
const LOCK = [0, 0], GRACE = [0, 0];                     // touch lock-out after a false call · when the turn reached a seat
const WINDOW = 5000;                                     // how long a "Touch!" can be called after the mistake
const PREV = {};                                         // pile rects before the last render (for the card flight)
let LASTN = -1;

const isOnline = () => !!G && G.mode === 'online';
const isGuest = () => isOnline() && G.net.role === 'guest';
const isHostOnline = () => isOnline() && G.net.role === 'host';
const devSeats = () => !G ? [] : G.mode === 'two' ? [0, 1] : G.mode === 'cpu' ? [0] : isGuest() ? [1] : [0];
function isBot(s) { if (!G) return false; if (G.mode === 'cpu') return s === 1; if (isHostOnline()) return s === 1 && !!G.sub && !guestOnline(); return false; }
const guestOnline = () => typeof rosterOnline === 'function' && rosterOnline(1);
function curView() { if (!G) return null; if (isGuest()) return G.v; if (!G.M) return null; return TN.view(G.M, perspective()); }
function rulesGame() { return isGuest() ? (G.v ? TN.fromView(G.v) : null) : G.M; }
function perspective() {
  if (!G) return 0;
  if (G.mode === 'two') { const t = G.M ? G.M.turn : 0; return ST.flip ? t : 0; }
  return isGuest() ? 1 : 0;
}
function actor() {                                        // the seat this device may move for right now (or null)
  const v = curView(); if (!v || v.over) return null;
  if (!devSeats().includes(v.turn) || isBot(v.turn)) return null;
  if (isGuest() && BUSY) return null;
  return v.turn;
}
const nameOf = s => {
  if (!G) return '';
  if (G.mode === 'cpu' && s === 1) return T('cpuName', T(LVL[G.lvl]));
  if (isHostOnline() && s === 1 && isBot(1)) return (G.names[1] || T('friend')) + ' 🤖';
  return G.names[s] || (s === 0 ? T('player') + ' 1' : T('player') + ' 2');
};
const LVL = ['lvEasy', 'lvMed', 'lvHard'], AV = ['img/av-04.webp', 'img/av-03.webp', 'img/av-11.webp'];

/* ---------- starting games ---------- */
function newSession(mode, o) {
  clearTimers();
  G = { mode, id: Date.now(), names: o.names || [ST.name || T('you'), ''], lvl: o.lvl == null ? 1 : o.lvl, target: o.target == null ? 100 : o.target, touch: o.touch || 'beginner',
    score: [0, 0], gameNo: 0, counted: {}, hints: 0, undo: [], lastFirst: null, net: o.net || null };
  if (mode !== 'online') startGameNo();
}
function startGameNo() {
  clearTimers();
  const first = G.lastFirst == null ? null : 1 - G.lastFirst;
  G.M = TN.newGame({ touch: G.touch, first });
  G.lastFirst = G.M.first; G.gameNo++; G.mid = G.id + ':' + G.gameNo; G.hints = 0; G.undo = []; G.touchCalls = [0, 0];
  SEL = null; HINT = null; turnMoves = 0; LASTN = -1; LOCK[0] = LOCK[1] = 0; GRACE[0] = GRACE[1] = 0;
  saveGame(); beep('shuffle');
}
function startCpu(lvl, touch, target) { newSession('cpu', { lvl, touch, target }); show('game'); afterChange(); }
function startTwo(names, touch, target) { newSession('two', { names, touch, target }); show('game'); afterChange(); }

function clearTimers() { clearTimeout(aiT); clearTimeout(violT); clearTimeout(catchT); aiT = violT = catchT = null; }

/* ---------- acting ---------- */
const WHY = { found: 'whyFound', reserve: 'whyReserve', touched: 'whyTouched' }, CAUGHT = { found: 'caughtFound', reserve: 'caughtReserve', touched: 'caughtTouched' };
function humanAct(act) {
  const s = actor(); if (s == null) return;
  const H = rulesGame();
  if (act.a !== 'touch' && !TN.legal(H, s, act)) { beep('err'); return; }
  if (isGuest()) {
    const why = TN.breaks(H, s, act);
    if (why && G.v.touch === 'beginner') { blocked(s, why); return; }
    BUSY = true; clearTimeout(busyT); busyT = setTimeout(() => { BUSY = false; renderGame(); }, 4000);
    LINK.sendTo(0, { type: 'act', a: act }); SEL = null; HINT = null; renderGame(); return;
  }
  const u = G.mode !== 'online' && G.M.touch === 'beginner' && act.a === 'mv' && act.d !== 'W' ? { s: TN.snap(G.M), ln: G.M.log.length, st: JSON.stringify(G.M.st), n: G.M.n, t: G.M.turn } : null;
  const r = doAct(s, act);
  if (u && r.ok && G.M.turn === u.t && !G.M.over) { G.undo.push(u); saveGame(); renderBar(curView(), actor(), perspective()); }
}
function blocked(s, why) {
  beep('err'); buzz(30); toast(T(WHY[why]), 3200);
  const H = rulesGame();
  const want = why === 'found' ? TN.foundMoves(H, s).map(m => m.s) : ['R'];
  setTimeout(() => want.forEach(src => { const el = srcEl(src); if (el) { el.classList.remove('must'); void el.offsetWidth; el.classList.add('must'); } }), 30);
}
/* apply one action on the real game (local player, computer, or a friend's intent on the host) */
function doAct(s, act) {
  const M = G.M, turnBefore = M.turn;
  const res = TN.apply(M, s, act);
  if (!res.ok) { if (WHY[res.why]) { if (devSeats().includes(s) && !isBot(s)) blocked(s, res.why); return res; } beep('err'); return res; }
  actSound(M.last);
  if (act.a === 'draw' || M.turn !== turnBefore) G.undo = [];
  if (res.viol) openWindow();
  SEL = null; HINT = null;
  afterChange();
  return res;
}
function actSound(L) {
  if (!L) return;
  if (L.a === 'draw') beep('flip');
  else if (L.a === 'mv') beep(L.d[0] === 'F' ? 'up' : L.d === 'OR' || L.d === 'OW' ? 'load' : 'card');
}

/* ---------- "Touch!" ---------- */
function openWindow() {
  const M = G.M; if (!M.viol) return;
  M.viol.at = Date.now(); saveGame();
  armWindow();
}
function armWindow() {
  clearTimeout(violT); clearTimeout(catchT);
  const M = G && G.M; if (!M || !M.viol) return;
  const left = WINDOW - (Date.now() - (M.viol.at || 0));
  if (left <= 0) { closeWindow(); return; }
  violT = setTimeout(closeWindow, left);
  const catcher = 1 - M.viol.by;
  if (isBot(catcher)) {                                  // the computer may notice a human's slip
    const lv = G.mode === 'cpu' ? G.lvl : 2, [p, ms] = TB.CATCH[lv];
    if (M.viol.roll == null) { M.viol.roll = Math.random(); saveGame(); }
    if (M.viol.roll < p) catchT = setTimeout(() => resolveTouch(catcher), Math.min(left - 300, ms * (ST.speed === 'fast' ? .6 : 1) + Math.random() * 600));
  }
}
function closeWindow() { const M = G && G.M; if (!M || !M.viol) return; TN.apply(M, M.viol.by, { a: 'vx' }); saveGame(); netBroadcast(); }
function callTouch(seat) {
  if (Date.now() < LOCK[seat]) return;
  if (isGuest()) { LINK.sendTo(0, { type: 'touch' }); LOCK[seat] = Date.now() + 1500; return; }
  resolveTouch(seat);
}
function resolveTouch(seat) {
  const M = G.M; if (!M || M.over) return;
  G.touchCalls = G.touchCalls || [0, 0]; G.touchCalls[seat]++;
  const r = TN.touch(M, seat);
  if (r.caught) {
    clearTimeout(violT); clearTimeout(catchT); G.undo = []; SEL = null; HINT = null; turnMoves = 0;
    touchShow({ ok: true, caller: seat, by: r.by, why: r.why });
    if (isHostOnline()) LINK.sendTo(1, { type: 'tev', ok: true, caller: seat, by: r.by, why: r.why });
    afterChange();
  } else {
    LOCK[seat] = Date.now() + 4000;
    touchShow({ ok: false, caller: seat });
    if (isHostOnline()) LINK.sendTo(1, { type: 'tev', ok: false, caller: seat });
    saveGame(); renderGame();
  }
}
function touchShow(e) {
  if (e.ok) {
    beep('touch'); buzz([60, 40, 60]);
    banner('✋ ' + T('touchBang'), T(CAUGHT[e.why] || 'caughtFound', nameOf(e.by)) + ' · ' + T('turnTo', nameOf(e.caller)), 'touch');
  } else {
    beep('err');
    const mine = devSeats().includes(e.caller) && !isBot(e.caller);
    toast(mine ? T('noTouch') : T('xNoTouch', nameOf(e.caller)), 2600);
  }
}
function banner(big, small, cls) {
  const host = $('#game'); if (!host || SCREEN !== 'game') return;           // outside #tarea: a re-render must not wipe it
  host.querySelectorAll('.tn-banner').forEach(b => b.remove());
  const b = document.createElement('div'); b.className = 'tn-banner ' + (cls || ''); b.innerHTML = (cls === 'touch' ? '<img class="stamp" src="img/touch-stamp.webp" alt="">' : '') + '<b>' + esc(big) + '</b>' + (small ? '<span>' + esc(small) + '</span>' : '');
  host.appendChild(b); setTimeout(() => b.remove(), 2700);
}

/* ---------- after every change ---------- */
function afterChange() {
  if (!G) return;
  const M = G.M;
  if (M) {
    if (M.turn !== lastTurnSeen) { if (lastTurnSeen >= 0) GRACE[M.turn] = Date.now(); lastTurnSeen = M.turn; turnMoves = 0; if (devSeats().includes(M.turn) && !isBot(M.turn) && !M.over) { beep('turn'); if (G.mode === 'two' && ST.flip) banner(T('turnOf', nameOf(M.turn))); } }
    if (M.over && !G.counted[G.mid]) gameOver();
  }
  saveGame();
  if (SCREEN === 'game') renderGame();
  netBroadcast();
  scheduleBot();
}
function scheduleBot() {
  clearTimeout(aiT);
  if (!G || !G.M || G.M.over || isGuest()) return;
  const t = G.M.turn; if (!isBot(t)) return;
  const fast = ST.speed === 'fast', d = (turnMoves ? (fast ? 260 : 650) : (fast ? 450 : 1000));
  aiT = setTimeout(botStep, d);
}
function botStep() {
  if (!G || !G.M || G.M.over) return;
  if (anyOv() || SCREEN !== 'game' && G.mode !== 'online') { aiT = setTimeout(botStep, 600); return; }
  const M = G.M, t = M.turn; if (!isBot(t)) return;
  const lv = G.mode === 'cpu' ? G.lvl : 2;
  let act = ++turnMoves > 150 ? TB.choose(M, t, 'human') : TB.choose(M, t, lv, { sloppy: M.touch === 'classic' });
  let r = doAct(t, act);
  if (!r.ok) {                                            // never stall: fall back to a safe, legal action
    const f = TN.foundMoves(M, t), rm = TN.targets(M, t, 'R').filter(d => d !== 'W');
    act = f[0] || (M.drawn < 0 && rm.length ? { a: 'mv', s: 'R', d: rm[0] } : M.drawn >= 0 ? { a: 'mv', s: 'D', d: 'W' } : TN.canDraw(M, t) ? { a: 'draw' } : { a: 'pass' });
    r = doAct(t, act);
    if (!r.ok) logErr('bot stuck ' + JSON.stringify(act));
  }
}

/* ---------- undo (beginner rules, on this phone, inside your turn until you turn a stock card) ---------- */
function undo() {
  const u = G && G.undo && G.undo.pop(); if (!u || isGuest()) return;
  TN.unsnap(G.M, u.s); G.M.log.length = u.ln; G.M.st = JSON.parse(u.st); G.M.n = u.n; G.M.viol = null; G.M.last = null;
  SEL = null; HINT = null; LASTN = G.M.n; saveGame(); renderGame();
}
/* ---------- hint: the hard computer, from what this player can see ---------- */
function hint() {
  const s = actor(); if (s == null) return;
  const H = rulesGame(); const a = TB.hint(H, s); G.hints++; saveGame();
  HINT = a; SEL = null; renderGame();
  const txt = a.a === 'draw' ? T('hDraw') : a.a === 'pass' ? T('hPass') : a.d === 'W' ? T('hDiscard') : T('hMove', cardTxt(TN.cardAt(H, s, a.s)), dstName(a.d, s));
  toast('💡 ' + txt, 3600);
}
function dstName(d, s) {
  if (d[0] === 'F') return T('dFound');
  if (d[0] === 'T') return T('dTab');
  if (d === 'OR') return T('dOR', nameOf(1 - s));
  if (d === 'OW') return T('dOW', nameOf(1 - s));
  return T('pWaste');
}

/* ---------- end of game · match ---------- */
function gameOver() {
  const M = G.M; G.counted[G.mid] = 1;
  if (M.winner >= 0) G.score[M.winner] += M.pts.total;
  const matchOver = !G.target || G.score[0] >= G.target || G.score[1] >= G.target;
  G.matchOver = matchOver;
  clearTimers();
  saveReplay({ seed: M.seed, touch: M.touch, first: M.first, log: M.log }, M.winner, M.pts, perspective());
  recordStats(M.winner, M.pts, M.st, matchOver);
  const me = devSeats().length === 1 ? devSeats()[0] : -1;
  beep(M.winner < 0 ? 'lose' : me < 0 || M.winner === me ? 'win' : 'lose');
  setTimeout(() => showResult(), 700);
}
function resultData() {
  if (isGuest()) { const v = G.v; return { winner: v.winner, pts: v.pts, end: v.end, st: v.st, score: G.score, target: G.target, matchOver: G.matchOver, gameNo: G.gameNo }; }
  const M = G.M; return { winner: M.winner, pts: M.pts, end: M.end, st: M.st, score: G.score, target: G.target, matchOver: G.matchOver, gameNo: G.gameNo };
}
function showResult() {
  if (!G || SCREEN !== 'game') return;
  if ($('#ovs .res')) return;                              // never stack a result on a result
  if (anyOv()) closeAllOv();
  const R = resultData(); if (!R || R.winner == null) return;
  const me = devSeats().length === 1 ? devSeats()[0] : -1;
  const ttl = R.winner < 0 ? T('drawGame') : (me >= 0 ? (R.winner === me ? T('youWon') : T('xWon', nameOf(R.winner))) : T('xWon', nameOf(R.winner)));
  let h = '<div class="res">' + (R.winner >= 0 && (me < 0 || R.winner === me) ? '<img class="winArt" src="img/win.webp" alt="">' : '') + '<h3>' + esc(ttl) + '</h3>';
  if (R.winner < 0) h += '<p class="muted">' + esc(T(R.end === 'cap' ? 'endCap' : 'endStuck')) + '</p>';
  else {
    const p = R.pts, L = nameOf(1 - R.winner);
    h += '<div class="big">' + iso('+' + NF(p.total)) + '</div><table class="tbl"><tr><td>' + esc(T('ptBase')) + '</td><td>' + num(30) + '</td></tr>' +
      '<tr><td>' + esc(T('ptSW', L)) + '</td><td>' + iso(NF(p.sw) + ' × 1 = ' + NF(p.sw)) + '</td></tr>' +
      '<tr><td>' + esc(T('ptR', L)) + '</td><td>' + iso(NF(p.r) + ' × 2 = ' + NF(p.r * 2)) + '</td></tr></table>';
  }
  if (R.target) h += '<div class="mscore">' + [0, 1].map(s => '<div>' + num(R.score[s]) + '<small>' + esc(nameOf(s)) + '</small></div>').join('<div>:</div>') + '</div><p class="muted" style="text-align:center;margin:0">' + esc(R.matchOver ? T('matchOverX', nameOf(R.score[0] >= R.score[1] ? 0 : 1)) : T('matchTo', NF(R.target))) + '</p>';
  // a short look back at the game
  const st = R.st, mine = me >= 0 ? me : 0;
  h += '<ul class="ana muted">' +
    '<li>' + esc(T('anLoaded', nameOf(0), num(st.loaded[0]), nameOf(1), num(st.loaded[1]))) + '</li>' +
    (R.st && (st.touchOk[0] + st.touchOk[1] + st.viol[0] + st.viol[1]) ? '<li>' + esc(T('anTouch', num(st.touchOk[mine]), num(st.viol[1 - mine]), num(st.viol[mine]))) + '</li>' : '') +
    (G.hints ? '<li>' + esc(T('hintsUsed', num(G.hints))) + '</li>' : '') + '</ul>';
  const host = !isGuest();
  h += '<div class="row" style="margin-top:12px">';
  if (host) h += R.matchOver ? '<button class="btn main" data-k="again">🔁 ' + esc(R.target ? T('rematch') : T('newGame')) + '</button>' : '<button class="btn main" data-k="next">▶ ' + esc(T('nextGame')) + '</button>';
  else h += '<div class="muted" style="flex:1;text-align:center;align-self:center">' + esc(T('waitHostNext')) + '</div>';
  h += '</div><div class="row" style="margin-top:8px"><button class="btn ghosty" data-k="board">👁 ' + esc(T('seeBoard')) + '</button><button class="btn ghosty" data-k="home">🏠 ' + esc(T('home')) + '</button></div></div>';
  const o = overlay(h, 'center');
  o.addEventListener('click', e => {
    const k = e.target.closest('[data-k]'); if (!k) return; const v = k.dataset.k;
    if (v === 'board') { closeOv(o); return; }
    if (v === 'home') { closeOv(o); show('home'); renderHome(); return; }
    closeOv(o);
    if (v === 'next') nextGame(); else if (v === 'again') rematch();
  });
}
function nextGame() { if (isGuest()) return; startGameNo(); afterChange(); }
function rematch() { if (isGuest()) return; G.score = [0, 0]; G.gameNo = 0; G.matchOver = false; G.id = Date.now(); startGameNo(); afterChange(); }

/* ---------- stats & replays ---------- */
function statKey() { return G.mode === 'cpu' ? 'cpu' + G.lvl : G.mode; }
function recordStats(winner, pts, st, matchOver) {

function netStart() {
  if (!isHostOnline() || !rosterOnline(1)) return;
  G.touch = G.cfg.touch; G.target = G.cfg.target; G.names = [ST.name || T('player'), nameAt(1) || T('friend')];
  G.score = [0, 0]; G.gameNo = 0; G.matchOver = false; G.id = Date.now();
  startGameNo(); show('game'); afterChange();
}
function netBroadcast() {
  if (!isHostOnline() || !G.M || !LINK || !LINK.session) return;
  if (!LINK.roster.some(p => p.seat === 1)) return;
  const M = G.M;
  LINK.sendTo(1, { type: 'view', v: TN.view(M, 1), names: G.names, score: G.score, target: G.target, gameNo: G.gameNo, mid: G.mid, matchOver: !!G.matchOver, sub: isBot(1),
    rep: M.over ? { seed: M.seed, touch: M.touch, first: M.first, log: M.log } : null });   // after the end everything may be shown
  // only the newest full view matters — blank the older ones (session stays small, numbering intact)
  const lk = LINK.session.links && LINK.session.links[1];
  if (lk && lk.out) { let seen = false; for (let i = lk.out.length - 1; i >= 0; i--) { const d = lk.out[i].d; if (d && d.type === 'view') { if (seen) lk.out[i].d = { type: 'x' }; seen = true; } } }
}
function netMsg(m, from) {
  if (!G || !isOnline() || !m) return;
  if (isHostOnline()) {
    if (from !== 1) return;
    if (m.type === 'act' && m.a && m.a.a === 'hold') { if (G.M && !G.M.over && TN.apply(G.M, 1, m.a).ok) { saveGame(); renderGame(); } netBroadcast(); return; }
    if (m.type === 'act') { if (!G.M || G.M.over) { netBroadcast(); return; } const r = doAct(1, m.a); if (!r.ok) { LINK.sendTo(1, { type: 'nope', why: r.why }); netBroadcast(); } }
    else if (m.type === 'touch') { if (G.M) resolveTouch(1); }
    else if (m.type === 'hello') netBroadcast();
    return;
  }
  // guest
  if (m.type === 'lobby') { G.cfg = m.cfg; saveGame(); if (SCREEN === 'lobby') renderLobby(); return; }
  if (m.type === 'nope') { BUSY = false; clearTimeout(busyT); if (WHY[m.why]) blocked(1, m.why); else beep('err'); renderGame(); return; }
  if (m.type === 'tev') { if (!m.ok && m.caller === 1) LOCK[1] = Date.now() + 4000; touchShow(m); if (m.ok) { SEL = null; HINT = null; } renderGame(); return; }
  if (m.type === 'view') {
    const prev = G.v, v = m.v, newGame = G.mid !== m.mid;
    if (newGame) { closeAllOv(); LASTN = -1; G.hints = 0; SEL = null; HINT = null; if (prev) beep('shuffle'); }
    if (prev && !newGame && v.n !== prev.n && v.last && v.last.p === 0) actSound(v.last);
    if (prev && !newGame && v.n !== prev.n && v.last && v.last.p === 1) actSound(v.last);
    if ((!prev || prev.turn !== v.turn) && !v.over) { GRACE[v.turn] = Date.now(); if (v.turn === 1) { beep('turn'); buzz(20); } }
    G.v = v; G.names = m.names; G.score = m.score; G.target = m.target; G.gameNo = m.gameNo; G.mid = m.mid; G.matchOver = m.matchOver; G.touch = v.touch;
    BUSY = false; clearTimeout(busyT);
    if (v.over && !G.counted[m.mid]) {
      G.counted[m.mid] = 1;
      if (m.rep) saveReplay(m.rep, v.winner, v.pts, 1);
      recordStats(v.winner, v.pts || { total: 0 }, v.st, m.matchOver);
      beep(v.winner === 1 ? 'win' : 'lose');
      setTimeout(showResult, 700);
    }
    saveGame();
    if (SCREEN === 'lobby') show('game'); else renderGame();
  }
}

    '<div class="card"><h3>' + esc(T('data')) + '</h3><div class="row"><button class="btn" id="sBackup">⬇️ ' + esc(T('backup')) + '</button><label class="btn" for="sRestore">⬆️ ' + esc(T('restore')) + '</label><input type="file" id="sRestore" accept="application/json,.json" class="hide"></div><p class="muted">' + esc(T('dataNote')) + '</p>' +
    '<div class="row"><button class="btn ghosty" id="sTour">🧭 ' + esc(T('tourAgain')) + '</button><button class="btn ghosty" id="sReset" style="color:var(--bad);border-color:var(--bad)">🗑️ ' + esc(T('deleteAll')) + '</button></div></div>' +
    '<div class="badge">TouchNest v' + APP_VERSION + ' · © AppNest 2026</div>';
  $('#sName').onchange = e => { ST.name = e.target.value.trim().slice(0, 20); saveST(); };
  $('#sLang').onchange = e => { ST.lang = e.target.value; saveST(); applyLang(); renderSettings(); renderHome(); };
  $$('#setBody [data-theme-pick]').forEach(x => x.onclick = () => { ST.theme = x.dataset.themePick; saveST(); applyLook(); renderSettings(); });
  $$('#setBody [data-seg]').forEach(sg => sg.onclick = e => { const v = e.target.closest('[data-v]'); if (!v) return; const k = sg.dataset.seg; ST[k] = isNaN(+v.dataset.v) ? v.dataset.v : +v.dataset.v; saveST(); applyLook(); renderSettings(); });
  $$('#setBody .sw').forEach(x => { const f = () => { ST[x.dataset.k] = !ST[x.dataset.k]; saveST(); applyLook(); renderSettings(); }; x.onclick = f; x.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
  $('#sBackup').onclick = backup;
  $('#sRestore').onchange = e => { if (e.target.files[0]) restore(e.target.files[0]); };
  $('#sTour').onclick = () => tour(true);
  $('#sReset').onclick = () => confirmBox(T('deleteAllQ'), T('deleteAll'), () => confirmBox(T('deleteAllQ2'), T('deleteAll'), () => { try { LINK && LINK.close(); } catch (e) {} LS.keys().forEach(k => LS.del(k)); location.href = location.pathname; }));
}

/* ---------- stats ---------- */
function renderStats() {
  const S = LS.get('stats', {}); let h = '';
  const pct = (a, n) => n ? Math.round(a / n * 100) + '%' : '–';
  for (const k of ['cpu0', 'cpu1', 'cpu2', 'two', 'online']) {
    const b = S[k]; if (!b || !b.g) continue;
    const lab = k.startsWith('cpu') ? T('vsCpu') + ' · ' + T(LVL[+k[3]]) : k === 'two' ? T('twoPhone') : T('online');
    h += '<div class="card"><h3>' + esc(lab) + '</h3><table class="tbl">' +
      (k === 'two' ? '<tr><td>' + esc(T('gamesPlayed')) + '</td><td>' + num(b.g) + '</td><td></td></tr>' : '<tr><td>' + esc(T('gamesWon')) + '</td><td>' + iso(NF(b.w) + ' / ' + NF(b.g)) + '</td><td>' + pct(b.w, b.g) + '</td></tr>') +
      (b.m && k !== 'two' ? '<tr><td>' + esc(T('matchesWon')) + '</td><td>' + iso(NF(b.mw) + ' / ' + NF(b.m)) + '</td><td>' + pct(b.mw, b.m) + '</td></tr>' : '') +
      (b.best ? '<tr><td>' + esc(T('bestWin')) + '</td><td>' + num(b.best) + '</td><td></td></tr>' : '') +
      (k !== 'two' ? '<tr><td>' + esc(T('loadedOn')) + '</td><td>' + num(b.ld) + '</td><td></td></tr>' : '') +
      (b.tc || b.tv ? '<tr><td>' + esc(T('touchStat')) + '</td><td>' + iso(NF(b.tc) + ' / ' + NF(b.tv)) + '</td><td></td></tr>' : '') + '</table></div>';
  }
  $('#statBody').innerHTML = h ? h + '<p class="muted">' + esc(T('touchStatSub')) + '</p>' : '<div class="card"><p>' + esc(T('noStats')) + '</p><button class="btn main" id="stPlay" style="width:100%">' + esc(T('vsCpu')) + '</button></div>';
  if ($('#stPlay')) $('#stPlay').onclick = () => setupBox('cpu');
}

/* ---------- replays (seed + actions → the engine rebuilds every step) ---------- */
function renderReplays() {
  const R = LS.get('replays', []);
  if (!R.length) { $('#repBody').innerHTML = '<div class="card"><p>' + esc(T('noReplays')) + '</p></div>'; return; }
  $('#repBody').innerHTML = R.map((r, i) => '<button class="card" data-i="' + i + '" style="width:100%;text-align:start;cursor:pointer;display:block;color:var(--ink)"><b>' + esc(r.names[0] + ' — ' + r.names[1]) + '</b><div class="muted">' + esc(new Date(r.d).toLocaleString(ST.lang)) + '</div><div>' + esc(r.winner < 0 ? T('drawGame') : T('xWon', r.names[r.winner]) + ' · +' + r.pts) + '</div></button>').join('');
  $$('#repBody [data-i]').forEach(b => b.onclick = () => playReplay(R[+b.dataset.i]));
}
function playReplay(r) {
  let frames; try { frames = TN.replay(r.rep); } catch (e) { toast(T('replayBad')); return; }
  if (!frames || frames.length < 2) { toast(T('replayBad')); return; }
  let i = 0, auto = null; const me = r.me || 0;
  const o = overlay('<h3>' + esc(T('replay')) + '</h3><div class="rp" id="rpBody"></div><div class="row" dir="ltr" style="margin-top:10px"><button class="btn" data-k="0">⏮</button><button class="btn" data-k="-1">◀</button><button class="btn main" data-k="p">▶</button><button class="btn" data-k="1">▶|</button><button class="btn" data-k="9">⏭</button></div><div class="row" style="margin-top:8px"><button class="btn ghosty" data-k="x">' + esc(T('close')) + '</button></div>', 'center');
  function draw() {
    const f = frames[i], M = f.G, v = TN.view(M, me), e = f.e, nm = s => r.names[s] || '';
    const host = $('#rpBody');
    let t = !e ? T('dealt') : e[1] === 'touch' ? '✋ ' + T('touchBang') + ' — ' + nm(e[0]) : e[1] === 'draw' ? nm(e[0]) + ': ' + T('rDraw') : e[1] === 'pass' ? nm(e[0]) + ': ' + T('bPass') :
      nm(e[0]) + ': ' + cardTxt(f.c != null ? f.c : (M.last && M.last.c)) + ' → ' + (e[3] === 'W' ? T('pWaste') : e[3][0] === 'F' ? T('dFound') : e[3][0] === 'T' ? T('dTab') : e[3] === 'OR' ? T('dOR', nm(1 - e[0])) : T('dOW', nm(1 - e[0])));
    host.innerHTML = '<div class="tarea" style="min-height:0">' + tableHTML(v, { me, act: null, names: r.names }) + '</div><div class="msg">' + esc(t) + '</div><p class="muted" style="text-align:center;margin:0">' + iso(i + ' / ' + (frames.length - 1)) + '</p>';
    host.style.setProperty('--cw', Math.max(24, Math.min(40, Math.floor((host.clientWidth - 24) / 6.4))) + 'px'); host.style.setProperty('--ocw', host.style.getPropertyValue('--cw'));
    fitPilesIn(host);
  }
  o.addEventListener('click', e => {
    const k = e.target.closest('[data-k]'); if (!k) return; const v = k.dataset.k;
    if (v === 'x') { clearInterval(auto); closeOv(o); return; }
    if (v === 'p') { if (auto) { clearInterval(auto); auto = null; k.textContent = '▶'; } else { k.textContent = '⏸'; auto = setInterval(() => { if (i < frames.length - 1) { i++; draw(); } else { clearInterval(auto); auto = null; k.textContent = '▶'; } }, 700); } return; }
    i = v === '0' ? 0 : v === '9' ? frames.length - 1 : Math.max(0, Math.min(frames.length - 1, i + +v)); draw();
  });
  draw();
}
function fitPilesIn(host) { fitPiles(host); }

/* ---------- rules ---------- */
function renderRules() {
  const ex = cs => '<div class="ex">' + cs.map(c => c < 0 ? '<div class="slot"></div>' : cardHTML(c)).join('') + '</div>';
  $('#rulesBody').innerHTML = T('rulesA') + ex([0, 1, 2]) + T('rulesB') + ex([12, 37, 11]) + T('rulesC') + ex([7, 8, 9]) + T('rulesD');
}

/* ---------- about ---------- */
function renderAbout() {
  $('#aboutBody').innerHTML = '<div style="text-align:center"><img src="icon-192.png" alt="" width="84" height="84" style="border-radius:20px"><h2 style="font-family:var(--disp);font-weight:400;margin:8px 0 0">TouchNest · ' + esc(T('appName')) + '</h2><div class="muted">' + esc(T('tagline')) + '</div></div>' +
    '<div class="card" style="margin-top:14px"><table class="tbl" style="text-align:start"><tr><td>' + esc(T('version')) + '</td><td>' + APP_VERSION + '</td></tr><tr><td>' + esc(T('developer')) + '</td><td>Barak Aflalo</td></tr><tr><td>' + esc(T('platform')) + '</td><td>PWA · HTML5</td></tr><tr><td>' + esc(T('storage')) + '</td><td>' + esc(T('storageVal')) + '</td></tr><tr><td>' + esc(T('license')) + '</td><td>' + iso('© AppNest 2026') + '</td></tr></table></div>' +
    '<div class="row"><a class="btn" href="https://appnest-store.pages.dev" target="_blank" rel="noopener">🏪 ' + esc(T('store')) + '</a><button class="btn" id="aShare">📤 ' + esc(T('shareApp')) + '</button></div>' +
    '<div class="row" style="margin-top:10px"><a class="btn" href="mailto:appnest55@gmail.com?subject=TouchNest%20' + APP_VERSION + '">✉️ ' + esc(T('feedback')) + '</a><button class="btn" id="aTour">🧭 ' + esc(T('tourAgain')) + '</button></div>' +
    '<div class="row" style="margin-top:10px"><a class="btn" href="privacy_policy.html" target="_blank">🔒 ' + esc(T('privacy')) + '</a><button class="btn" id="aRules">📖 ' + esc(T('rules')) + '</button></div>' +
    '<div class="card" style="margin-top:14px"><h3>' + esc(T('disclaimerT')) + '</h3><p class="muted">' + esc(T('disclaimer')) + '</p></div>' +
    '<div class="card"><h3>' + esc(T('diag')) + '</h3><p class="muted" style="direction:ltr;text-align:left;font-size:12px;word-break:break-all">' + esc('v' + APP_VERSION + ' · ' + navigator.userAgent.slice(0, 120) + ' · SW:' + ('serviceWorker' in navigator) + ' · WebRTC:' + (!!window.RTCPeerConnection) + ' · mic:' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) + '</p>' + (ERRS.length ? '<p class="muted" style="direction:ltr;text-align:left;font-size:12px">' + ERRS.map(e => esc(e.t.slice(5, 16) + ' ' + e.m)).join('<br>') + '</p>' : '<p class="muted">' + esc(T('noErrors')) + '</p>') + '</div>';
  $('#aShare').onclick = async () => { const d = { title: 'TouchNest', text: T('shareText') + (ST.name ? ' — ' + ST.name : ''), url: location.origin + location.pathname }; try { if (navigator.share) await navigator.share(d); else { await navigator.clipboard.writeText(d.url); toast(T('copied')); } } catch (e) {} };
  $('#aTour').onclick = () => tour(true);
  $('#aRules').onclick = () => { renderRules(); RULES_BACK = 'about'; show('rules'); };
}

/* ---------- first-run tour ---------- */
function tour(force) {
  if (!force && ST.tutDone) return;
  const steps = [['🃏', 'tour1t', 'tour1'], ['⬆️', 'tour2t', 'tour2'], ['🔻', 'tour3t', 'tour3'], ['🎯', 'tour4t', 'tour4'], ['✋', 'tour5t', 'tour5'], ['🏆', 'tour6t', 'tour6']];
  let i = 0;
  const o = overlay('<div class="tut" id="tutB"></div>', 'center'); o.dataset.lock = '1';
  function draw() {
    const [ic, t, b] = steps[i];
    $('#tutB').innerHTML = '<div class="big">' + ic + '</div><h3>' + esc(T(t)) + '</h3><p>' + esc(T(b)) + '</p><div class="dots">' + steps.map((_, j) => '<i class="' + (j === i ? 'on' : '') + '"></i>').join('') + '</div><div class="row"><button class="btn ghosty" data-k="skip">' + esc(T('skip')) + '</button><button class="btn main" data-k="next">' + esc(i === steps.length - 1 ? T('letsPlay') : T('next')) + '</button></div>';
  }
  o.addEventListener('click', e => { const k = e.target.closest('[data-k]'); if (!k) return; if (k.dataset.k === 'next' && i < steps.length - 1) { i++; draw(); return; } ST.tutDone = true; saveST(); closeOv(o); });
  draw();
}

/* ---------- init ---------- */
function init() {
  applyLook(); applyLang(); initLink(); bindGame(); bindVoice();
  $$('[data-home]').forEach(b => b.onclick = () => {
    if (b.closest('#rules') && RULES_BACK !== 'home') { const t = RULES_BACK; RULES_BACK = 'home'; show(t); return; }
    if (b.closest('#lobby') && isOnline() && !G.M && !G.v) { netLeave(); return; }
    show('home'); renderHome();
  });
  $('#hTheme').onclick = () => { ST.theme = THEMES[(THEMES.indexOf(ST.theme) + 1) % THEMES.length]; saveST(); applyLook(); toast('🎨 ' + T('theme')); };
  $('#hMode').onclick = () => { ST.mode = ST.mode === 'day' ? 'night' : 'day'; saveST(); applyLook(); };
  $('#hLang').onclick = () => { const ks = Object.keys(LANGS); ST.lang = ks[(ks.indexOf(ST.lang) + 1) % ks.length]; saveST(); renderHome(); toast(LANGS[ST.lang]); };
  $('#hAbout').onclick = () => { renderAbout(); show('about'); };
  $('#hRules').onclick = () => { renderRules(); RULES_BACK = 'home'; show('rules'); };
  $('#hStats').onclick = () => { renderStats(); show('stats'); };
  $('#hReplays').onclick = () => { renderReplays(); show('replays'); };
  $('#hSettings').onclick = () => { renderSettings(); show('settings'); };
  $('#mCpu').onclick = () => setupBox('cpu');
  $('#mTwo').onclick = () => setupBox('two');
  $('#mOnline').onclick = () => { if (isOnline()) { show(G.M || G.v ? 'game' : 'lobby'); if (!G.M && !G.v) renderLobby(); } else openOnline(); };
  $('#mCont').onclick = () => {
    if (!G) return;
    if (isOnline()) { show(G.M || G.v ? 'game' : 'lobby'); if (!G.M && !G.v) renderLobby(); return; }
    show('game'); afterChange(); if (G.M && G.M.viol) armWindow();
  };
  // a saved game from an incompatible build is dropped gently
  if (G && G.M && G.M.v !== 1) { G = null; saveGame(); }
  if (G && isOnline() && G.net && G.net.sess) { LINK.resume(G.net.sess); if (isGuest() && G.v) setTimeout(() => LINK.isOpen() && LINK.sendTo(0, { type: 'hello' }), 1500); }
  else if (G && isOnline()) { G = null; saveGame(); }
  if (G && G.M && G.M.viol && !isGuest()) armWindow();
  const q = new URLSearchParams(location.search), jc = q.get('join');
  renderHome();
  if (jc) {
    const q2 = new URLSearchParams(location.search); q2.delete('join'); history.replaceState(null, '', location.pathname + (q2.toString() ? '?' + q2 : ''));
    if (isOnline() && LINK.session && LINK.session.code === jc.toUpperCase()) show(G.v ? 'game' : 'lobby');
    else if (isOnline()) { toast(T('alreadyInRoom')); show('lobby'); renderLobby(); }
    else { if (!ST.name) { show('lobby'); renderLobby(); $('#lCode').value = jc.toUpperCase(); toast(T('enterNameJoin'), 4000); } else openOnline(jc); }
  } else if (isOnline()) { show(G.M || G.v ? 'game' : 'lobby'); if (!(G.M || G.v)) renderLobby(); else afterChange(); }
  else tour(false);
  if (location.protocol === 'file:') toast(T('fileWarn'), 6000);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !q.get('nosw')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('DOMContentLoaded', init);

</script>
